<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Link Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <h2>🚀 FB Link Affiliate Generator</h2>
        <p class="subtitle">Buat link pancingan Facebook tanpa repot ubah kodingan</p>
        
        <div class="form-group">
            <label for="judul">Judul Postingan Facebook (Clickbait):</label>
            <input type="text" id="judul" placeholder="Contoh: Promo Gila Baju Tidur Murah Banget!">
        </div>

        <div class="form-group">
            <label for="gambar">Link Gambar Kolase (URL Gambar):</label>
            <input type="text" id="gambar" placeholder="Masukkan URL gambar yang sudah di-upload...">
        </div>

        <div class="form-group">
            <label for="shopee">Link Affiliate Shopee Tujuan:</label>
            <input type="text" id="shopee" placeholder="https://shopee.co.id/product/...">
        </div>

        <button id="btnGenerate" class="btn-primary">Generate Link Promosi</button>

        <div class="result-section" id="resultSection" style="display: none;">
            <label>Link Siap Tempel di Facebook:</label>
            <div class="copy-box">
                <input type="text" id="hasilLink" readonly>
                <button id="btnCopy">Copy</button>
            </div>
            <p class="tips">*Tempel link ini di Facebook, tunggu gambar muncul, lalu hapus link-nya dan ganti dengan caption-mu!</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
